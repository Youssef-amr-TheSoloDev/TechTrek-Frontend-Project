<div class="section-heading">
    <div class="section-heading__copy">
        @if (eyebrow) {
        <span class="section-heading__eyebrow">{{ eyebrow }}</span>
        }
        <h2 class="section-heading__title">{{ title }}</h2>
        @if (description) {
        <p class="section-heading__description">{{ description }}</p>
        }
    </div>

    @if (actionLabel) {
    <a class="section-heading__action" [routerLink]="['/explore']">
        {{ actionLabel }}
        <app-icon [ImagePath]="'assets/icons/' + actionIcon + '.svg'" Size="1em"></app-icon>
    </a>
    }
</div>
