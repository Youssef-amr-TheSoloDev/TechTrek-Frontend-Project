<nav class="navbar" [class.navbar--search-open]="isSearchOpen">
  <div class="navbar__brand">
    <a href="/" aria-label="Home page">
      <app-site-logo></app-site-logo>
    </a>
  </div>

  <div class="navbar__center">
    <div class="navbar__nav" [class.navbar__nav--hidden]="isSearchOpen" aria-label="Main navigation">
      <ul class="navbar__list">
        <li class="navbar__item"><a class="navbar__link" href="/">Home</a></li>
        <li class="navbar__item"><a class="navbar__link" href="/explore">Explore</a></li>
        <li class="navbar__item"><a class="navbar__link" href="/about">About</a></li>
      </ul>
    </div>

    <form class="navbar__search" [class.navbar__search--visible]="isSearchOpen" (submit)="submitSearch($event)">
      <label class="navbar__search-label" for="navbar-search">Search books</label>
      <div class="navbar__search-field">
        <app-icon ImagePath="assets/icons/search.svg" Color="var(--color-primary)"></app-icon>
        <input id="navbar-search" class="navbar__search-input" type="search" [value]="searchTerm"
          (input)="searchTerm = $any($event.target).value" placeholder="Search for books..."
          aria-label="Search for books" />
        <button class="navbar__search-submit" type="submit">Search</button>
        <button class="navbar__search-close" type="button" aria-label="Close search" (click)="toggleSearch()">
          <app-icon ImagePath="assets/icons/x.svg" Color="var(--color-primary)" Size="1em"></app-icon>
        </button>
      </div>
    </form>
  </div>

  <div class="navbar__actions" aria-label="Quick actions">
    <button class="navbar__icon-button" type="button" aria-label="Search" (click)="toggleSearch()">
      <app-icon ImagePath="assets/icons/search.svg"></app-icon>
    </button>
    <button class="navbar__icon-button" type="button" aria-label="Shopping bag">
      <app-icon ImagePath="assets/icons/shopping-bag.svg"></app-icon>
    </button>

    <button class="navbar__account" type="button" aria-label="My account">
      <span class="navbar__account-inner">
        <app-icon ImagePath="assets/icons/user.svg" Color="var(--color-border)"></app-icon>
        <span class="navbar__account-label">My Account</span>
        <app-icon ImagePath="assets/icons/arrow-down.svg" Color="var(--color-border)" Size="1em"></app-icon>
      </span>
    </button>
  </div>
</nav>
