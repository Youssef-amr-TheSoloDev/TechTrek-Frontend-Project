<section class="newsletter">
    <div class="container newsletter__inner">
        <h2>{{ title }}</h2>
        <p>{{ description }}</p>
        <form (ngSubmit)="submit()"><input name="email" type="email" [(ngModel)]="email"
                placeholder="Enter your email address" aria-label="Email address" required /><button
                type="submit">Subscribe</button></form><small>No spam, ever. Unsubscribe with one click. Read our <a
                routerLink="/policy">Privacy Policy</a>.</small>
    </div>
</section>
