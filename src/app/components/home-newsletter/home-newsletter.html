<section class="newsletter">
    <div class="container newsletter__inner">
        <h2>{{ title }}</h2>
        <p>{{ description }}</p>
        <form (ngSubmit)="submit()"><input name="email" type="email" [(ngModel)]="email" placeholder="Email address"
                aria-label="Email address" required /><button type="submit">Join Now</button></form><small>WEEKLY
            CURATED · NO SPAM · EASY UNSUBSCRIBE</small>
    </div>
</section>
